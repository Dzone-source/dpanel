<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>DPanel — Đăng nhập</title>
  <link href="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta20/dist/css/tabler.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/tabler-icons.min.css" rel="stylesheet"/>
  <link href="/assets/css/gopass.css" rel="stylesheet"/>
</head>
<body class="gopass-auth border-top-wide border-primary d-flex flex-column">
<div class="page page-center">
  <div class="container-tight my-auto">
    <div class="text-center mb-4">
      <a href="index.html" class="navbar-brand navbar-brand-autodark">
        <img src="/images/uim-logo-round_96x96.png" height="64" alt="DPanel Logo">
      </a>
      <div class="mt-2 text-white fw-bold" style="font-size:1.25rem;letter-spacing:.02em">DPanel</div>
    </div>
    <div class="card card-md">
      <div class="card-body">
        <h2 class="card-title text-center mb-4">Đăng nhập vào trung tâm người dùng</h2>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" value="admin@demo.local" readonly>
        </div>
        <div class="mb-2">
          <label class="form-label">
            Mật khẩu đăng nhập
            <span class="form-label-description"><a href="#">Quên mật khẩu</a></span>
          </label>
          <input type="password" class="form-control" value="••••••••" readonly>
        </div>
        <div class="mb-3">
          <label class="form-check">
            <input type="checkbox" class="form-check-input" checked/>
            <span class="form-check-label">Ghi nhớ thiết bị</span>
          </label>
        </div>
        <div class="form-footer">
          <a href="dashboard.html" class="btn btn-primary w-100 mb-3">Đăng nhập</a>
        </div>
      </div>
    </div>
    <div class="text-center text-white-50 mt-3">
      <a href="dashboard.html" class="link-light">Xem dashboard demo →</a>
    </div>
  </div>
</div>
</body>
</html>
